name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Report synthetic benchmark
        if: matrix.python-version == '3.12'
        run: python -m factorytwin.benchmark --ticks 2000 --sqlite-ticks 100 --json
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed wheel
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --no-deps dist/factorytwin-*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -c "from importlib.metadata import version; from pathlib import Path; import factorytwin; import factorytwin.sim as sim; import factorytwin.__main__ as app; from factorytwin._version import __version__; assert version('factorytwin') == __version__; assert factorytwin.ProductionLine is sim.ProductionLine; assert (Path(app.ROOT) / 'index.html').is_file()"
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -m factorytwin --help >/dev/null
          "$GITHUB_WORKSPACE/.wheel-venv/bin/factorytwin" --help >/dev/null

  windows-test:
    name: test (Windows, Python 3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
